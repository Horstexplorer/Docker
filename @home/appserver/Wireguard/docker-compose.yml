name: Wireguard
services:
  wg-easy:
    # https://wg-easy.github.io/wg-easy/latest/
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    restart: unless-stopped
    env_file: wg-easy.env
    networks:
      wireguard:
        interface_name: eth0
        gw_priority: 1
      traefik:
        interface_name: eth1
        gw_priority: 0
    expose:
      - 51820
      - 51821
    ports:
      - "51820:51820/udp"
    volumes:
      - wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    labels:
      traefik.enable: true
      traefik.http.routers.wireguard.rule: Host(`wireguard.domain.tld`)
      traefik.http.routers.wireguard.entrypoints: https
      traefik.http.routers.wireguard.middlewares: local-ip-ranges@file
      traefik.http.routers.wireguard.service: wireguard
      traefik.http.services.wireguard.loadbalancer.server.port: 51821

volumes:
  wireguard:
    name: wireguard

networks:
  wireguard:
    name: wireguard
    driver: bridge
    enable_ipv6: true
  traefik:
    external: true
