name: GoBin
services:
  gobin:
    image: ghcr.io/topi314/gobin:latest
    container_name: gobin
    restart: unless-stopped
    volumes:
      - ./gobin.json:/var/lib/gobin/gobin.json
    networks:
      - gobin
      - traefik
    expose:
      - 80
    labels:
      traefik.enable: true
      traefik.http.routers.gobin.rule: Host(`paste.domain.tld`)
      traefik.http.routers.gobin.entrypoints: https
      traefik.http.routers.gobin.service: gobin
      traefik.http.services.gobin.loadbalancer.server.port: 80

  gobin-postgresql:
    image: postgres:18
    container_name: gobin-postgresql
    restart: unless-stopped
    env_file: postgresql.env
    networks:
      - gobin
    expose:
      - 5432
    volumes:
      - gobin-postgresql:/var/lib/postgresql

volumes:
  gobin-postgresql:
    name: gobin-postgresql

networks:
  gobin:
    name: gobin
  traefik:
    external: true